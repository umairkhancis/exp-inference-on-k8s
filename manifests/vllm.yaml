apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
spec:
  replicas: 1
  # First boot = image pull + model download on a shared line; don't let
  # the rollout be declared failed before that finishes.
  progressDeadlineSeconds: 1800
  # Single-node cluster: a surge pod can't schedule while the old one
  # holds the CPU/memory reservation, so replace instead of rolling.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      # The Service is named 'vllm', so k8s would inject the legacy
      # discovery var VLLM_PORT=tcp://... — which vLLM parses as its own
      # config and crashes on. Service links are obsolete; disable them.
      enableServiceLinks: false
      containers:
        - name: vllm
          # Multi-arch (amd64 + arm64) CPU build of vLLM. No GPU required,
          # which is what makes this runnable inside a Multipass VM on a Mac.
          image: mekayelanik/vllm-cpu:0.30.0
          command: ["vllm", "serve"]
          args:
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--host=0.0.0.0"
            - "--port=8000"
            # 2048 was the 8G-VM ceiling; Open WebUI's native tool calling
            # alone injects >2k tokens of tool schemas per request, so the
            # context must be comfortably larger (Qwen2.5 supports 32k).
            - "--max-model-len=8192"
            # Keep the startup memory profile under the 5Gi limit on an
            # 8G VM: small batch ceiling + 1GiB KV cache (env below).
            - "--max-num-seqs=4"
            # torch.compile's C++ kernel compilation is broken in this
            # image (missing inductor headers); eager mode skips it.
            - "--enforce-eager"
            # Open WebUI sends tool_choice:"auto" with chat requests;
            # without these vLLM 400s every message. Qwen2.5 uses the
            # hermes tool-call format.
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
          env:
            # GiB of RAM reserved for the KV cache (CPU backend).
            - name: VLLM_CPU_KVCACHE_SPACE
              value: "1"
            # The image's torch install can't C++-compile inductor
            # kernels (missing cpp_prefix.h); --enforce-eager alone
            # doesn't cover the sampler's torch.compile path, so turn
            # dynamo off entirely and run pure eager.
            - name: TORCHDYNAMO_DISABLE
              value: "1"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "2"
              memory: 3Gi
            limits:
              memory: 6Gi
          # First boot downloads ~1GB of model weights from Hugging Face,
          # so allow up to 20 minutes before declaring the pod dead.
          # timeoutSeconds: the default 1s is too strict on a shared CPU —
          # a neighbor pod's image pull or startup (e.g. Open WebUI) can
          # delay /health past 1s and the liveness probe then kills a
          # healthy vLLM, forcing a multi-minute model reload.
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            # The image sets HF_HOME=/data/models (NOT ~/.cache/huggingface),
            # so the cache must be mounted there or every restart re-downloads
            # the full model weights.
            - name: hf-cache
              mountPath: /data/models
            # vLLM's engine needs >64Mi of shared memory for its IPC ring
            # buffer; the k8s default /dev/shm is 64Mi and crashes it.
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # Keeps downloaded weights on the minikube node so pod restarts
        # don't re-download the model.
        - name: hf-cache
          hostPath:
            path: /data/hf-cache
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
spec:
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30800
