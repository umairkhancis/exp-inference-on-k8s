<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1100px 750px at 50% 30%, #13223f 0%, #0b1120 60%, #070b16 100%);
    color: #e2e8f0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .kicker {
    font-size: 19px; font-weight: 600; letter-spacing: 4px; text-transform: uppercase;
    color: #5eead4; margin-bottom: 54px;
  }
  .lockup { display: flex; align-items: center; gap: 64px; margin-bottom: 64px; }
  .tile {
    width: 280px; height: 280px; background: #ffffff; border-radius: 52px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 70px rgba(2, 8, 23, .75), 0 0 0 1px rgba(148,163,184,.12);
  }
  .x { font-size: 84px; font-weight: 300; color: #475569; }
  .tile img.llmd { width: 248px; object-fit: contain; }
  /* crop container: k8s.png carries a grey strip on its right edge */
  .k8s-crop {
    width: 204px; height: 204px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .k8s-crop img { width: 240px; height: 240px; object-fit: cover; object-position: 46% 50%; }

  h1 { font-size: 54px; font-weight: 800; color: #f8fafc; margin-bottom: 16px; letter-spacing: .5px; }
  h1 .dim { color: #475569; font-weight: 300; padding: 0 6px; }
  .sub { font-size: 25px; color: #94a3b8; margin-bottom: 0; }
  .sub b { color: #38bdf8; font-weight: 700; }

  .footer {
    position: absolute; bottom: 36px; left: 90px; right: 90px;
    display: flex; justify-content: space-between; font-size: 17px; color: #475569;
  }
  .footer b { color: #94a3b8; font-weight: 600; }
</style>
</head>
<body>
  <div class="kicker">Inference Unpacked · Experiment 04</div>

  <div class="lockup">
    <div class="tile"><img class="llmd" src="llmd.jpeg" alt="llm-d"></div>
    <div class="x">×</div>
    <div class="tile"><div class="k8s-crop"><img src="k8s.png" alt="Kubernetes"></div></div>
  </div>

  <h1>llm-d <span class="dim">on</span> Kubernetes</h1>
  <div class="sub">Your own OpenAI compatible inference layer · flat rate · <b>$0.00 per token</b></div>

  <div class="footer">
    <div><b>github.com/umairkhancis/exp-inference-on-k8s</b></div>
    <div>kubeadm · 4 nodes · one command · reproducible</div>
  </div>
</body>
</html>
